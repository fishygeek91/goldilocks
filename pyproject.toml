[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "goldilocks"
version = "0.0.1"
description = "Noise-assisted quantum-walk proposals for exact MCMC (ENAQT-for-sampling)"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10"]

[project.optional-dependencies]
dev = ["pytest>=7"]
circuits = ["qiskit>=1.0", "qiskit-aer"]
paper = ["matplotlib>=3.8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
